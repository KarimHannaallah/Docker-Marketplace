# lancement : cp .env.example .env, puis docker compose up --build
# application sur http://localhost:8080 (port modifiable avec FRONTEND_PORT)

name: marketplace

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    volumes:
      # Données conservées entre deux redémarrages
      - db-data:/var/lib/postgresql/data
      # scripts SQL exécutés une seule fois, à la création du volume
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-1}"
          memory: ${DB_MEM_LIMIT:-512M}
        reservations:
          cpus: "${DB_CPU_RESERVATION:-0.25}"
          memory: ${DB_MEM_RESERVATION:-256M}
    networks: [backend]
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
      # Limitation du débit par IP (voir .env.example)
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${AUTH_CPU_LIMIT:-0.5}"
          memory: ${AUTH_MEM_LIMIT:-256M}
        reservations:
          cpus: "${AUTH_CPU_RESERVATION:-0.1}"
          memory: ${AUTH_MEM_RESERVATION:-128M}
    networks: [backend]
    restart: unless-stopped

  catalog-service:
    build: ./services/catalog-service
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${CATALOG_CPU_LIMIT:-0.5}"
          memory: ${CATALOG_MEM_LIMIT:-256M}
        reservations:
          cpus: "${CATALOG_CPU_RESERVATION:-0.1}"
          memory: ${CATALOG_MEM_RESERVATION:-128M}
    networks: [backend]
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:8000
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${ORDER_CPU_LIMIT:-0.5}"
          memory: ${ORDER_MEM_LIMIT:-256M}
        reservations:
          cpus: "${ORDER_CPU_RESERVATION:-0.1}"
          memory: ${ORDER_MEM_RESERVATION:-128M}
    networks: [backend]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # seul port publié ; nginx écoute sur 8080 dans le conteneur (non-root, donc pas de port 80)
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-0.25}"
          memory: ${FRONTEND_MEM_LIMIT:-128M}
        reservations:
          cpus: "${FRONTEND_CPU_RESERVATION:-0.05}"
          memory: ${FRONTEND_MEM_RESERVATION:-64M}
    networks: [frontend, backend]
    restart: unless-stopped

volumes:
  db-data:

networks:
  frontend:
  # réseau interne : pas d'accès depuis l'extérieur, seul le frontend publie un port
  backend:
    internal: true
