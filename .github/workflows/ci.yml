name: CI

# Déclenchement : chaque push sur n'importe quelle branche, chaque tag, et chaque pull request.
on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

# Droits minimaux par défaut ; le job `docker` demande en plus l'écriture sur GHCR.
permissions:
  contents: read

jobs:
  # --- Services Node.js (auth-service et order-service) : lint, tests, build ---
  node-services:
    name: Node (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [auth-service, order-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # --- Service Python (catalog-service) : ruff et pytest ---
  python-service:
    name: Python (catalog-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/catalog-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  # --- Frontend : lint et build ---
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # --- Qualité des Dockerfiles ---
  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        dockerfile:
          - frontend/Dockerfile
          - services/auth-service/Dockerfile
          - services/catalog-service/Dockerfile
          - services/order-service/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  compose:
    name: Docker Compose config (environnements)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Valider chaque fichier d'environnement
        run: |
          status=0
          for env_file in .env.example .env.test.example .env.uat.example .env.prod.example; do
            echo "::group::docker compose --env-file $env_file config"
            docker compose --env-file "$env_file" config --quiet || status=1
            echo "::endgroup::"
          done
          # On teste tous les fichiers avant d'échouer, pour voir toutes les erreurs d'un coup.
          exit $status

  # --- Détection de secrets (mots de passe, clés...) dans le code et dans tout l'historique git ---
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : un secret supprimé dans un commit récent reste visible dans les anciens.
          fetch-depth: 0
      # image officielle en version fixée ; GIT_CONFIG_* autorise git à lire le dépôt monté (autre propriétaire)
      - name: Scan gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --config /repo/.gitleaks.toml --redact --no-banner -v

  # --- Construction, analyse de sécurité (Trivy) et publication des 4 images sur GHCR ---
  # Ne démarre que si tous les contrôles précédents ont réussi.
  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [node-services, python-service, frontend, hadolint, compose, gitleaks]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: frontend
            context: frontend
          - image: auth-service
            context: services/auth-service
          - image: catalog-service
            context: services/catalog-service
          - image: order-service
            context: services/order-service
    # Les images ne sont poussées que sur push (jamais sur pull_request : on construit seulement).
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # GHCR exige un nom d'image en minuscules, or le dépôt peut contenir des majuscules.
      - name: Nom d'image en minuscules
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # tags : sha-<7 caractères du commit> à chaque commit, nom du tag git sur un push de tag,
      # et latest sur la branche main seulement
      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      # 1) build local, sans publier, pour pouvoir analyser l'image
      - name: Build local pour l'analyse
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: scan/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 2) Trivy échoue s'il reste une vulnérabilité CRITICAL avec correctif disponible (--ignore-unfixed)
      #    en cas d'échec, l'image n'est pas publiée
      - name: Scan Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            scan/${{ matrix.image }}:ci

      - name: Connexion à GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
