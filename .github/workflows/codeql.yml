name: CodeQL

# Analyse statique du code source par GitHub CodeQL (recherche de failles : injections, XSS, etc.).
# Les résultats apparaissent dans l'onglet Security > Code scanning du dépôt.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Chaque lundi à 06:00 UTC : de nouvelles règles de détection sortent régulièrement
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # nécessaire pour envoyer les résultats à GitHub
    strategy:
      fail-fast: false
      matrix:
        # Le code est en TypeScript/JavaScript (frontend + 2 services) et en Python (catalog-service)
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Langages interprétés : pas de compilation nécessaire
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
