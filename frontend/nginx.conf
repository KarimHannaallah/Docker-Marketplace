# seul point d'entrée : sert le frontend et redirige /api/<service>/... vers les backends (réseau interne).
# le préfixe /api est retiré : /api/auth/login -> http://auth-service:3001/auth/login

server {
    # 8080 : nginx tourne sans droits root et ne peut pas utiliser un port < 1024
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # adresse du client transmise aux backends (auth-service limite le débit par IP)
    # $proxy_add_x_forwarded_for ajoute l'IP réelle à droite ; avec trust proxy = 1 le backend ne retient que celle-là
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- API : reverse proxy vers les micro-services ---
    location /api/auth {
        proxy_pass http://auth-service:3001/auth;
    }

    # Gestion des utilisateurs (routes ADMIN), également portée par auth-service
    location /api/admin {
        proxy_pass http://auth-service:3001/admin;
    }

    location /api/catalog {
        proxy_pass http://catalog-service:8000/catalog;
    }

    location /api/orders {
        proxy_pass http://order-service:3002/orders;
    }

    # Les URL /api/... inconnues renvoient 404 JSON (et non la page HTML du frontend)
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Route introuvable"}';
    }

    # --- Fichiers générés par Vite : le nom contient un hash, on peut les mettre en cache longtemps ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Application React (SPA) : toute autre URL renvoie index.html, React Router fait le reste ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
