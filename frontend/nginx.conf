# nginx sert le frontend ET joue le rôle de reverse proxy : c'est le seul point d'entrée.
# Les backends ne sont joignables que par ce proxy, via le réseau interne Docker.
#
# Règle : on remplace le préfixe /api/<x> par le chemin attendu par le service.
#   /api/auth/login     -> http://auth-service:3001/auth/login
#   /api/admin/users    -> http://auth-service:3001/admin/users
#   /api/catalog/products -> http://catalog-service:8000/catalog/products
#   /api/orders/cart    -> http://order-service:3002/orders/cart

server {
    # 8080 et non 80 : nginx tourne sans droits root et ne peut pas utiliser un port < 1024
    # (docker-compose.yml publie ce port sur FRONTEND_PORT côté machine hôte).
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API : reverse proxy vers les micro-services ---
    location /api/auth {
        proxy_pass http://auth-service:3001/auth;
    }

    # Gestion des utilisateurs (routes ADMIN), également portée par auth-service
    location /api/admin {
        proxy_pass http://auth-service:3001/admin;
    }

    location /api/catalog {
        proxy_pass http://catalog-service:8000/catalog;
    }

    location /api/orders {
        proxy_pass http://order-service:3002/orders;
    }

    # Les URL /api/... inconnues renvoient 404 JSON (et non la page HTML du frontend)
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Route introuvable"}';
    }

    # --- Fichiers générés par Vite : le nom contient un hash, on peut les mettre en cache longtemps ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Application React (SPA) : toute autre URL renvoie index.html, React Router fait le reste ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
