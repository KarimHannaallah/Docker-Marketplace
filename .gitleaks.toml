# Configuration de gitleaks (détection de secrets dans le code et l'historique git).

title = "marketplace gitleaks config"

[extend]
# On garde toutes les règles par défaut de gitleaks...
useDefault = true

# ...sauf pour les fichiers de tests, qui contiennent des secrets FACTICES
# (ex. SECRET = "test-secret-..." pour signer des JWT de test). Ils ne protègent rien.
[[allowlists]]
description = "Secrets factices utilisés uniquement par les tests"
paths = [
  '''(^|/)tests?/''',
]