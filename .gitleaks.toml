# Configuration de gitleaks (détection de secrets dans le code et l'historique git).

title = "marketplace gitleaks config"

[extend]
# règles par défaut de gitleaks conservées
useDefault = true

# sauf dans les tests, qui contiennent des secrets factices
[[allowlists]]
description = "Secrets factices utilisés uniquement par les tests"
paths = [
  '''(^|/)tests?/''',
]